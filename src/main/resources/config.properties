# Browser to run tests on: chrome | firefox | edge
browser=chrome

# Run browser headless (true/false) - useful for CI pipelines
headless=false

# Application under test
url=https://www.saucedemo.com/

# Wait configuration (in seconds)
implicitWait=5
explicitWait=25
pageLoadTimeout=30

# Standard test credentials for SauceDemo
validUsername=standard_user
validPassword=secret_sauce
lockedUsername=locked_out_user
invalidUsername=invalid_user
invalidPassword=wrong_password
